<style>
  :root{
    --bg:#0f1117; --ink:#f2f3f7; --muted:#9aa0b4;
    --btn:rgba(255,255,255,.07); --btn-hover:rgba(255,255,255,.12); --btn-line:rgba(255,255,255,.12);
    --a1:#7c5cff; --a2:#22d3ee;
  }
  :root[data-theme="light"]{
    --bg:#f3f4fa; --ink:#14161f; --muted:#5f6478;
    --btn:rgba(255,255,255,.85); --btn-hover:#ffffff; --btn-line:rgba(20,22,31,.1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark light}
  body{
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; padding:56px 18px 36px;
    position:relative; overflow-x:hidden; transition:background .25s,color .25s;
  }
  /* soft aurora glow */
  body::before,body::after{
    content:"";position:fixed;width:520px;height:520px;border-radius:50%;
    filter:blur(110px);opacity:.35;z-index:0;pointer-events:none;
  }
  body::before{background:var(--a1);top:-180px;left:-160px}
  body::after{background:var(--a2);bottom:-220px;right:-160px;opacity:.25}

  main{position:relative;z-index:1;width:100%;max-width:480px;text-align:center}

  .theme{
    position:absolute;top:-28px;right:0;background:var(--btn);border:1px solid var(--btn-line);
    color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;
    backdrop-filter:blur(8px);transition:transform .2s;
  }
  .theme:hover{transform:rotate(20deg)}

  .avatar{
    width:96px;height:96px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--a1),var(--a2));
    display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;
    box-shadow:0 0 0 4px var(--bg),0 0 0 6px rgba(124,92,255,.5);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}

  h1{font-size:24px;letter-spacing:-.02em}
  .handle{color:var(--muted);font-size:14px;margin-top:2px}
  .bio{color:var(--muted);font-size:15px;line-height:1.5;margin:12px auto 0;max-width:36ch}

  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:12px}
  a.link{
    --c:#888;
    display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;
    background:var(--btn);border:1px solid var(--btn-line);border-radius:16px;
    color:inherit;text-decoration:none;backdrop-filter:blur(10px);
    transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
  }
  a.link:hover,a.link:focus-visible{
    transform:translateY(-3px);background:var(--btn-hover);border-color:var(--c);
    box-shadow:0 10px 28px -12px var(--c);outline:none;
  }
  a.link:active{transform:translateY(-1px) scale(.99)}
  .ico{
    width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:var(--c);color:#fff;
  }
  .ico svg{width:22px;height:22px}
  .txt{flex:1;text-align:left;min-width:0}
  .t{display:block;font-weight:600;font-size:16px}
  .s{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{color:var(--muted);transition:transform .18s,color .18s;flex:none}
  a.link:hover .go{transform:translateX(3px);color:var(--ink)}

  /* brand colours */
  .discord{--c:#5865f2}
  .instagram{--c:#e1306c}
  .instagram .ico{background:linear-gradient(45deg,#f9a03f,#e1306c 50%,#833ab4)}
  .github{--c:#6e7681}
  .youtube{--c:#ff0033}
  .x{--c:#444}
  .telegram{--c:#27a7e7}
  .mail{--c:#f59e0b}
  .web{--c:#10b981}

  footer{margin-top:36px;font-size:12px;color:var(--muted)}

  .in{opacity:0;transform:translateY(12px);animation:in .5s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  li:nth-child(1){animation-delay:.10s}li:nth-child(2){animation-delay:.17s}
  li:nth-child(3){animation-delay:.24s}li:nth-child(4){animation-delay:.31s}
  li:nth-child(5){animation-delay:.38s}li:nth-child(n+6){animation-delay:.45s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
</style>
</head>

<script>
  (function(){
    var root=document.documentElement,key="theme",saved=null;
    try{saved=localStorage.getItem(key)}catch(e){}
    var light=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches;
    root.setAttribute("data-theme",saved||(light?"light":"dark"));
    document.getElementById("theme").addEventListener("click",function(){
      var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
      root.setAttribute("data-theme",n);
      try{localStorage.setItem(key,n)}catch(e){}
    });
    document.getElementById("yr").textContent=new Date().getFullYear();
  })();
</script>
